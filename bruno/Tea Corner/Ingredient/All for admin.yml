info:
  name: All for admin
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:3000/ingredient/admin/all?page=1&limit=10
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: pagination is available here and has to be used and set in parameters (or in the url as seen here)
