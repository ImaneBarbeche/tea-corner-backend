info:
  name: Create log
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/brew-log/create
  body:
    type: json
    data: |-
      {
        "tea_id": "f1a92542-b5f5-4682-ad54-4933f0506a70",
        "brewing_time": 200,
        "brewing_temperature": 98,
        "leaf_amount": 4,
        "water_amount": 180,
        "rating": 4,
        "notes": "OOF",
        "focused": false,
        "is_public": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
